<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1110" width="1400" height="1110" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'PingFang SC', Roboto, sans-serif">
  <title>qm Agent Platform — System Architecture (Dark)</title>
  <desc>Single VPS (11 GB RAM, 193 GB disk) running Docker. Four app services (core, portal, web UI, admin) behind Caddy reverse proxy. PostgreSQL holds all state. Chat via Slack (Bolt, Socket Mode) and web chat. AI via Claude Agent SDK with Pi, OpenCode, Codex, Claude Code harnesses and MCP connectors (Google, Huntora). Data from Apify (LinkedIn), Google Analytics 4, Google Search Console. Built on qm agent platform (forked July 2026).</desc>

  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#F97316" flood-opacity="0.04"/>
    </filter>
    <filter id="subShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#F97316" flood-opacity="0.05"/>
    </filter>

    <marker id="arrowSync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#F97316"/>
    </marker>
    <marker id="arrowAsync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>

    <linearGradient id="bgAmbient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F0F0F"/>
      <stop offset="50%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.10"/>
      <stop offset="35%" stop-color="#F97316" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1400" height="1110" fill="url(#bgAmbient)"/>
  <rect x="0" y="0" width="1400" height="1110" fill="url(#orangeGlow)"/>

  <!-- ───────── Title ───────── -->
  <text x="700" y="46" text-anchor="middle" font-size="24" font-weight="700" fill="#FAFAFA">qm Agent Platform — System Architecture</text>
  <text x="700" y="72" text-anchor="middle" font-size="13" fill="#B8B8B8">Single VPS · Docker · Caddy · Claude Agent SDK · MCP · qm fork (July 2026)</text>

  <!-- ═════════════════════════ ENTRY CHANNELS ═════════════════════════ -->
  <g id="entry-tier">
    <rect x="80" y="100" width="1240" height="130" rx="12" fill="#141414" filter="url(#cardShadow)"/>
    <rect x="80" y="100" width="1240" height="130" rx="12" fill="none" stroke="#333333" stroke-width="1"/>
    <text x="100" y="128" font-size="10.5" font-weight="700" fill="#FB923C" letter-spacing="1.2">ENTRY CHANNELS</text>
    <text x="100" y="146" font-size="11" fill="#8A8A8A">Where requests enter the system</text>

    <!-- Slack card -->
    <rect x="160" y="160" width="380" height="60" rx="8" fill="#1A1A1A" stroke="#454545" stroke-width="1" filter="url(#subShadow)"/>
    <rect x="160" y="160" width="4" height="60" fill="#F97316"/>
    <circle cx="195" cy="190" r="6" fill="#F97316"/>
    <text x="215" y="187" font-size="16" font-weight="600" fill="#FAFAFA">Slack (Bolt · Socket Mode)</text>
    <text x="215" y="207" font-size="12.5" fill="#B8B8B8">Slack Events API · real-time socket</text>

    <!-- Web Chat card -->
    <rect x="560" y="160" width="380" height="60" rx="8" fill="#1A1A1A" stroke="#454545" stroke-width="1" filter="url(#subShadow)"/>
    <rect x="560" y="160" width="4" height="60" fill="#F97316"/>
    <circle cx="595" cy="190" r="6" fill="#F97316"/>
    <text x="615" y="187" font-size="16" font-weight="600" fill="#FAFAFA">Web Chat</text>
    <text x="615" y="207" font-size="12.5" fill="#B8B8B8">In-app chat · streaming responses</text>

    <!-- Admin / internal card -->
    <rect x="960" y="160" width="280" height="60" rx="8" fill="#1A1A1A" stroke="#454545" stroke-width="1" filter="url(#subShadow)"/>
    <rect x="960" y="160" width="4" height="60" fill="#F97316"/>
    <circle cx="995" cy="190" r="6" fill="#F97316"/>
    <text x="1015" y="187" font-size="16" font-weight="600" fill="#FAFAFA">Admin / Internal</text>
    <text x="1015" y="207" font-size="12.5" fill="#B8B8B8">Ops + back-office</text>
  </g>

  <!-- ─── Arrow: Entry → Caddy (sync HTTPS) ─── -->
  <g id="arrow-entry-caddy">
    <line x1="700" y1="235" x2="700" y2="275" stroke="#F97316" stroke-width="2" marker-end="url(#arrowSync)"/>
    <rect x="630" y="248" width="140" height="20" rx="10" fill="#1A1A1A" stroke="#454545" stroke-width="1"/>
    <text x="700" y="262" text-anchor="middle" font-size="11" font-weight="500" fill="#FB923C">HTTPS · WSS</text>
  </g>

  <!-- ═════════════════════════ VPS · DOCKER ═════════════════════════ -->
  <g id="vps-tier">
    <rect x="80" y="285" width="1240" height="440" rx="12" fill="#141414" filter="url(#cardShadow)"/>
    <rect x="80" y="285" width="1240" height="440" rx="12" fill="none" stroke="#333333" stroke-width="1"/>
    <text x="100" y="313" font-size="10.5" font-weight="700" fill="#FB923C" letter-spacing="1.2">VPS · DOCKER HOST</text>
    <text x="100" y="331" font-size="11" fill="#8A8A8A">11 GB RAM · 193 GB disk · all services containerized</text>

    <!-- VPS spec pill -->
    <rect x="1100" y="295" width="200" height="30" rx="6" fill="#1F1F1F" stroke="#454545" stroke-width="1"/>
    <circle cx="1115" cy="310" r="3" fill="#F97316"/>
    <text x="1127" y="314" font-size="11" font-weight="500" fill="#B8B8B8">11 GB RAM · 193 GB disk</text>

    <!-- ─── Caddy reverse proxy band ─── -->
    <g id="caddy-band">
      <rect x="160" y="355" width="1080" height="50" rx="8" fill="#1A1A1A" stroke="#F97316" stroke-width="1.5" filter="url(#subShadow)"/>
      <rect x="160" y="355" width="4" height="50" fill="#F97316"/>
      <circle cx="195" cy="380" r="6" fill="#F97316"/>
      <text x="215" y="376" font-size="16" font-weight="600" fill="#FAFAFA">Caddy</text>
      <text x="215" y="394" font-size="12.5" fill="#B8B8B8">Reverse proxy · automatic HTTPS · per-host routing</text>
      <text x="1210" y="385" text-anchor="end" font-size="11" font-weight="600" fill="#FB923C">Edge</text>
    </g>

    <!-- ─── 4 app services row ─── -->
    <text x="100" y="438" font-size="10.5" font-weight="700" fill="#FB923C" letter-spacing="1.2">APP SERVICES (DOCKER CONTAINERS)</text>
    <text x="100" y="455" font-size="11" fill="#8A8A8A">Four service images · share Docker network</text>

    <!-- Service 1: core -->
    <g id="svc-core">
      <rect x="160" y="468" width="260" height="135" rx="8" fill="#1F1F1F" stroke="#454545" stroke-width="1" filter="url(#subShadow)"/>
      <rect x="160" y="468" width="4" height="135" fill="#F97316"/>
      <circle cx="185" cy="490" r="4" fill="#F97316"/>
      <text x="200" y="494" font-size="15" font-weight="600" fill="#FAFAFA">core</text>
      <text x="200" y="512" font-size="11" fill="#8A8A8A">Primary agent runtime</text>
      <g font-size="11.5" fill="#E5E5E5">
        <circle cx="180" cy="535" r="2" fill="#F97316"/>
        <text x="190" y="538">Agent orchestration</text>
        <circle cx="180" cy="555" r="2" fill="#F97316"/>
        <text x="190" y="558">Tool / MCP dispatch</text>
        <circle cx="180" cy="575" r="2" fill="#F97316"/>
        <text x="190" y="578">Session state</text>
        <circle cx="180" cy="595" r="2" fill="#F97316"/>
        <text x="190" y="598">API server</text>
      </g>
    </g>

    <!-- Service 2: portal -->
    <g id="svc-portal">
      <rect x="435" y="468" width="260" height="135" rx="8" fill="#1F1F1F" stroke="#454545" stroke-width="1" filter="url(#subShadow)"/>
      <rect x="435" y="468" width="4" height="135" fill="#F97316"/>
      <circle cx="460" cy="490" r="4" fill="#F97316"/>
      <text x="475" y="494" font-size="15" font-weight="600" fill="#FAFAFA">portal</text>
      <text x="475" y="512" font-size="11" fill="#8A8A8A">Public-facing API gateway</text>
      <g font-size="11.5" fill="#E5E5E5">
        <circle cx="455" cy="535" r="2" fill="#F97316"/>
        <text x="465" y="538">Auth + sessions</text>
        <circle cx="455" cy="555" r="2" fill="#F97316"/>
        <text x="465" y="558">Tenant routing</text>
        <circle cx="455" cy="575" r="2" fill="#F97316"/>
        <text x="465" y="578">Rate limits</text>
        <circle cx="455" cy="595" r="2" fill="#F97316"/>
        <text x="465" y="598">Web chat endpoint</text>
      </g>
    </g>

    <!-- Service 3: web UI -->
    <g id="svc-webui">
      <rect x="710" y="468" width="260" height="135" rx="8" fill="#1F1F1F" stroke="#454545" stroke-width="1" filter="url(#subShadow)"/>
      <rect x="710" y="468" width="4" height="135" fill="#F97316"/>
      <circle cx="735" cy="490" r="4" fill="#F97316"/>
      <text x="750" y="494" font-size="15" font-weight="600" fill="#FAFAFA">web UI</text>
      <text x="750" y="512" font-size="11" fill="#8A8A8A">React frontend · SSR</text>
      <g font-size="11.5" fill="#E5E5E5">
        <circle cx="730" cy="535" r="2" fill="#F97316"/>
        <text x="740" y="538">Chat interface</text>
        <circle cx="730" cy="555" r="2" fill="#F97316"/>
        <text x="740" y="558">Settings pages</text>
        <circle cx="730" cy="575" r="2" fill="#F97316"/>
        <text x="740" y="578">Reports viewer</text>
        <circle cx="730" cy="595" r="2" fill="#F97316"/>
        <text x="740" y="598">Auth flow</text>
      </g>
    </g>

    <!-- Service 4: admin -->
    <g id="svc-admin">
      <rect x="985" y="468" width="255" height="135" rx="8" fill="#1F1F1F" stroke="#454545" stroke-width="1" filter="url(#subShadow)"/>
      <rect x="985" y="468" width="4" height="135" fill="#F97316"/>
      <circle cx="1010" cy="490" r="4" fill="#F97316"/>
      <text x="1025" y="494" font-size="15" font-weight="600" fill="#FAFAFA">admin</text>
      <text x="1025" y="512" font-size="11" fill="#8A8A8A">Internal admin console</text>
      <g font-size="11.5" fill="#E5E5E5">
        <circle cx="1005" cy="535" r="2" fill="#F97316"/>
        <text x="1015" y="538">User + tenant mgmt</text>
        <circle cx="1005" cy="555" r="2" fill="#F97316"/>
        <text x="1015" y="558">Job inspector</text>
        <circle cx="1005" cy="575" r="2" fill="#F97316"/>
        <text x="1015" y="578">Feature flags</text>
        <circle cx="1005" cy="595" r="2" fill="#F97316"/>
        <text x="1015" y="598">Audit log</text>
      </g>
    </g>

    <!-- ─── Arrows: Caddy → 4 services (sync, internal routing) ─── -->
    <g id="arrows-caddy-svcs">
      <line x1="290" y1="405" x2="290" y2="465" stroke="#F97316" stroke-width="2" marker-end="url(#arrowSync)"/>
      <line x1="565" y1="405" x2="565" y2="465" stroke="#F97316" stroke-width="2" marker-end="url(#arrowSync)"/>
      <line x1="840" y1="405" x2="840" y2="465" stroke="#F97316" stroke-width="2" marker-end="url(#arrowSync)"/>
      <line x1="1110" y1="405" x2="1110" y2="465" stroke="#F97316" stroke-width="2" marker-end="url(#arrowSync)"/>
      <rect x="640" y="425" width="120" height="18" rx="9" fill="#1A1A1A" stroke="#454545" stroke-width="1"/>
      <text x="700" y="438" text-anchor="middle" font-size="10.5" fill="#FB923C">reverse proxy</text>
    </g>

    <!-- ─── PostgreSQL band ─── -->
    <g id="postgres-band">
      <rect x="160" y="620" width="1080" height="85" rx="8" fill="#1A1A1A" stroke="#F97316" stroke-width="1.5" filter="url(#subShadow)"/>
      <rect x="160" y="620" width="4" height="85" fill="#F97316"/>
      <circle cx="195" cy="645" r="6" fill="#F97316"/>
      <text x="215" y="642" font-size="16" font-weight="600" fill="#FAFAFA">PostgreSQL</text>
      <text x="215" y="660" font-size="12" fill="#B8B8B8">Single source of truth · holds all state</text>
      <g font-size="11.5" fill="#E5E5E5">
        <circle cx="180" cy="685" r="2" fill="#F97316"/>
        <text x="190" y="688">Users · tenants · sessions</text>
        <circle cx="410" cy="685" r="2" fill="#F97316"/>
        <text x="420" y="688">Agent runs · messages</text>
        <circle cx="640" cy="685" r="2" fill="#F97316"/>
        <text x="650" y="688">MCP tool results</text>
        <circle cx="850" cy="685" r="2" fill="#F97316"/>
        <text x="860" y="688">Cached external data</text>
        <circle cx="1075" cy="685" r="2" fill="#F97316"/>
        <text x="1085" y="688">Audit + jobs</text>
      </g>
      <text x="1210" y="650" text-anchor="end" font-size="11" font-weight="600" fill="#FB923C">Durable store</text>
    </g>

    <!-- ─── Arrows: 4 services → PostgreSQL (sync SQL) ─── -->
    <g id="arrows-svcs-pg">
      <line x1="290" y1="603" x2="290" y2="620" stroke="#F97316" stroke-width="2" marker-end="url(#arrowSync)"/>
      <line x1="565" y1="603" x2="565" y2="620" stroke="#F97316" stroke-width="2" marker-end="url(#arrowSync)"/>
      <line x1="840" y1="603" x2="840" y2="620" stroke="#F97316" stroke-width="2" marker-end="url(#arrowSync)"/>
      <line x1="1110" y1="603" x2="1110" y2="620" stroke="#F97316" stroke-width="2" marker-end="url(#arrowSync)"/>
    </g>
  </g>

  <!-- ─── Arrow: core → Claude Agent SDK (sync, calls LLM) ─── -->
  <g id="arrow-core-claude">
    <line x1="700" y1="725" x2="700" y2="765" stroke="#F97316" stroke-width="2" marker-end="url(#arrowSync)"/>
    <rect x="630" y="735" width="140" height="20" rx="10" fill="#1A1A1A" stroke="#454545" stroke-width="1"/>
    <text x="700" y="749" text-anchor="middle" font-size="11" font-weight="500" fill="#FB923C">agent SDK calls</text>
  </g>

  <!-- ═════════════════════════ AI / AGENT LAYER ═════════════════════════ -->
  <g id="ai-tier">
    <rect x="80" y="775" width="1240" height="180" rx="12" fill="#141414" filter="url(#cardShadow)"/>
    <rect x="80" y="775" width="1240" height="180" rx="12" fill="none" stroke="#333333" stroke-width="1"/>
    <text x="100" y="803" font-size="10.5" font-weight="700" fill="#FB923C" letter-spacing="1.2">AI / AGENT LAYER</text>
    <text x="100" y="821" font-size="11" fill="#8A8A8A">Claude Agent SDK · multiple harnesses · MCP connectors</text>

    <!-- Claude Agent SDK card (left, larger) -->
    <rect x="160" y="835" width="540" height="105" rx="8" fill="#1A1A1A" stroke="#454545" stroke-width="1" filter="url(#subShadow)"/>
    <rect x="160" y="835" width="4" height="105" fill="#F97316"/>
    <circle cx="195" cy="860" r="6" fill="#F97316"/>
    <text x="215" y="857" font-size="16" font-weight="600" fill="#FAFAFA">Claude Agent SDK</text>
    <text x="215" y="875" font-size="12" fill="#B8B8B8">Multi-harness orchestration · tool routing</text>
    <g font-size="12" fill="#E5E5E5">
      <circle cx="180" cy="900" r="2" fill="#F97316"/>
      <text x="190" y="903">Pi — research / reasoning</text>
      <circle cx="380" cy="900" r="2" fill="#F97316"/>
      <text x="390" y="903">OpenCode — code gen</text>
      <circle cx="180" cy="922" r="2" fill="#F97316"/>
      <text x="190" y="925">Codex — code execution</text>
      <circle cx="380" cy="922" r="2" fill="#F97316"/>
      <text x="390" y="925">Claude Code — CLI harness</text>
    </g>
    <text x="690" y="935" text-anchor="end" font-size="11" font-weight="600" fill="#FB923C">Harnesses</text>

    <!-- MCP connectors card (right) -->
    <rect x="720" y="835" width="520" height="105" rx="8" fill="#1A1A1A" stroke="#454545" stroke-width="1" filter="url(#subShadow)"/>
    <rect x="720" y="835" width="4" height="105" fill="#F97316"/>
    <circle cx="755" cy="860" r="6" fill="#F97316"/>
    <text x="775" y="857" font-size="16" font-weight="600" fill="#FAFAFA">MCP Connectors</text>
    <text x="775" y="875" font-size="12" fill="#B8B8B8">Standard Model Context Protocol tools</text>
    <g font-size="12" fill="#E5E5E5">
      <circle cx="740" cy="900" r="2" fill="#F97316"/>
      <text x="750" y="903">Google — search · Gmail · Calendar</text>
      <circle cx="740" cy="922" r="2" fill="#F97316"/>
      <text x="750" y="925">Huntora — security intel</text>
      <circle cx="740" cy="944" r="2" fill="#F97316"/>
      <text x="750" y="947">Extensible to additional MCP servers</text>
    </g>
    <text x="1210" y="868" text-anchor="end" font-size="11" font-weight="600" fill="#FB923C">Tools</text>
  </g>

  <!-- ═════════════════════════ EXTERNAL DATA SOURCES ═════════════════════════ -->
  <g id="data-tier">
    <rect x="80" y="975" width="1240" height="80" rx="12" fill="#141414" filter="url(#cardShadow)"/>
    <rect x="80" y="975" width="1240" height="80" rx="12" fill="none" stroke="#333333" stroke-width="1"/>
    <text x="100" y="1003" font-size="10.5" font-weight="700" fill="#FB923C" letter-spacing="1.2">EXTERNAL DATA SOURCES</text>
    <text x="100" y="1021" font-size="11" fill="#8A8A8A">Pulled via scheduled jobs · async fetches</text>

    <!-- Apify card -->
    <rect x="160" y="1010" width="375" height="40" rx="6" fill="#1A1A1A" stroke="#454545" stroke-width="1"/>
    <rect x="160" y="1010" width="4" height="40" fill="#F97316"/>
    <circle cx="185" cy="1030" r="4" fill="#F97316"/>
    <text x="200" y="1028" font-size="13" font-weight="600" fill="#FAFAFA">Apify</text>
    <text x="200" y="1044" font-size="11" fill="#B8B8B8">LinkedIn scraping actors</text>

    <!-- GA4 card -->
    <rect x="555" y="1010" width="375" height="40" rx="6" fill="#1A1A1A" stroke="#454545" stroke-width="1"/>
    <rect x="555" y="1010" width="4" height="40" fill="#F97316"/>
    <circle cx="580" cy="1030" r="4" fill="#F97316"/>
    <text x="595" y="1028" font-size="13" font-weight="600" fill="#FAFAFA">Google Analytics 4</text>
    <text x="595" y="1044" font-size="11" fill="#B8B8B8">Traffic + engagement metrics</text>

    <!-- Search Console card -->
    <rect x="950" y="1010" width="290" height="40" rx="6" fill="#1A1A1A" stroke="#454545" stroke-width="1"/>
    <rect x="950" y="1010" width="4" height="40" fill="#F97316"/>
    <circle cx="975" cy="1030" r="4" fill="#F97316"/>
    <text x="990" y="1028" font-size="13" font-weight="600" fill="#FAFAFA">Google Search Console</text>
    <text x="990" y="1044" font-size="11" fill="#B8B8B8">SERP + query data</text>
  </g>

  <!-- ─── Dashed async arrow: AI tier → External data (proxy through core/pg) ─── -->
  <g id="arrow-ai-data">
    <!-- From MCP card down to data tier (dashed, async fetch) — terminates cleanly on the data tier band -->
    <path d="M 980 940 L 980 968 L 700 968 L 700 975" fill="none" stroke="#6B7280" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowAsync)"/>
    <rect x="745" y="958" width="190" height="18" rx="9" fill="#1A1A1A" stroke="#454545" stroke-width="1"/>
    <text x="840" y="971" text-anchor="middle" font-size="10.5" fill="#B8B8B8">scheduled · async pull</text>
  </g>

  <!-- ═════════════════════════ LEGEND ═════════════════════════ -->
  <!-- (legend integrated compactly via the inline arrow labels above) -->

  <!-- Footer note -->
  <text x="700" y="1075" text-anchor="middle" font-size="10.5" fill="#6B7280">Built on the open-source qm agent platform (forked July 2026)</text>

</svg>
